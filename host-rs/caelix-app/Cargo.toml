[package]
name = "caelix-app"
version = "0.1.0"
edition = "2021"
description = "Standalone Rust host for the Caelix native renderer."

[dependencies]
anyhow = "1.0.104"
caelix-cxw = { path = "../caelix-cxw" }
caelix-sys = { path = "../caelix-sys" }
caelix-vk = { path = "../caelix-vk" }
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
exr = "1.73"
image = { version = "0.25", default-features = false, features = ["hdr"] }
log = "0.4.34"
png = "0.18.1"
raw-window-handle = "0.6.2"
serde_json = "1"
winit = "0.30.13"
egui = "0.36.2"
egui-winit = { version = "0.36.2", default-features = false, features = ["clipboard"] }
