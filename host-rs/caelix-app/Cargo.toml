[package]
name = "caelix-app"
version = "0.1.0"
edition = "2021"
description = "Standalone Rust host for the Caelix native renderer."

[dependencies]
anyhow = "1.0.104"
caelix-cxw = { path = "../caelix-cxw" }
caelix-sys = { path = "../caelix-sys" }
caelix-vk = { path = "../caelix-vk" }
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
log = "0.4.34"
raw-window-handle = "0.6.2"
winit = "0.30.13"
